<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>لوحة الإدارة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#6C5CE7;--primary2:#a29bfe;--bg:#f1f2f9;--card:#fff;--text:#151a2d;--muted:#71788f;--border:#e5e7f2;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--r:16px;--sh:0 6px 22px rgba(20,20,60,.07)}
body.dark{--bg:#0c0f1d;--card:#151a2e;--text:#e9ebf7;--muted:#98a0bd;--border:#242a45;--sh:0 6px 22px rgba(0,0,0,.4)}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;min-width:250px;background:var(--card);border-left:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.sidebar .logo{display:flex;align-items:center;gap:10px;padding:9px;font-weight:800;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:16px}
.sidebar .logo .l-ic{width:42px;height:42px;min-width:42px;background:linear-gradient(135deg,var(--primary),var(--primary2));border-radius:13px;display:grid;place-items:center;font-size:20px}
.sidebar .logo span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);transition:.2s;margin-bottom:3px;text-align:right}
.nav-btn:hover{background:var(--bg);color:var(--text)}
.nav-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:var(--sh)}
.nav-btn .n-ic{font-size:18px}
.main{flex:1;min-width:0;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:22px}
.top .actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:17px}
.icon-btn:hover{background:var(--bg)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:17px;box-shadow:var(--sh);margin-bottom:14px}
.card-t{font-weight:800;font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:15px;padding:14px;display:flex;align-items:center;gap:11px}
.stat-box .s-ic{width:44px;height:44px;min-width:44px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:20px;color:#fff}
.stat-box .s-t b{display:block;font-size:20px}
.stat-box .s-t span{font-size:12px;color:var(--muted)}
.btn{background:var(--primary);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s;border:1px solid transparent}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--bg);color:var(--text);border-color:var(--border)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 13px;outline:none;transition:.2s;font-size:14px}
.inp:focus{border-color:var(--primary);background:var(--card)}
textarea.inp{min-height:80px;resize:vertical;line-height:1.7}
select.inp{cursor:pointer}
.row{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;background:var(--bg);margin-bottom:8px;border:1px solid var(--border)}
.row .av{width:40px;height:40px;min-width:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:16px;color:#fff;font-weight:800}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:11.5px;color:var(--muted);display:block}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.pill{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;color:var(--muted)}
.empty{text-align:center;padding:34px 14px;color:var(--muted);font-size:14px}
.empty .e{font-size:44px;display:block;margin-bottom:11px}
.toast{position:fixed;bottom:30px;right:50%;transform:translate(50%,26px);background:#151a2d;color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90vw}
.toast.show{opacity:1;transform:translate(50%,0)}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(8,10,22,.65);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow:auto}
.modal-box h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.flex{display:flex;align-items:center;gap:9px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:9px}
.flex-wrap{flex-wrap:wrap}
.mt{margin-top:12px}.mb{margin-bottom:12px}.center{text-align:center}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(150deg,#151a2d,#0c0f1d)}
.auth-box{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-box .adm-logo{width:80px;height:80px;margin:0 auto 14px;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:38px}
.auth-box h1{text-align:center;font-size:21px;margin-bottom:5px}
.auth-box p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.active{background:var(--card);color:var(--primary);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase}
tr:hover td{background:var(--bg)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:600;margin:0 0 3px 3px}
.tag.ok{background:rgba(34,197,94,.15);border-color:var(--ok);color:var(--ok)}
.tag.bad{background:rgba(239,68,68,.15);border-color:var(--bad);color:var(--bad)}
.tag.warn{background:rgba(245,158,11,.15);border-color:var(--warn);color:var(--warn)}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.switch input{display:none}
.switch .tog{width:40px;height:22px;background:var(--border);border-radius:12px;position:relative;transition:.2s}
.switch .tog:after{content:"";position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;right:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .tog{background:var(--ok)}
.switch input:checked + .tog:after{right:21px}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:9px}
.color-input{width:60px;height:38px;border:1px solid var(--border);border-radius:10px;padding:3px;background:var(--bg);cursor:pointer}
.mobile-menu{display:none}
@media (max-width:820px){
  .sidebar{position:fixed;top:0;right:-270px;z-index:300;width:260px;transition:.3s;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
  .sidebar.open{right:0}
  .main{padding:14px}
  .mobile-menu{display:grid}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250}
  .overlay.open{display:block}
  table{font-size:12px}
  th,td{padding:8px 5px}
}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="overlay" id="overlay"></div>

<script>
/* ==========================================================================
   قاعدة البيانات المشتركة مع index.html — نفس المفتاح ونفس البنية
   ========================================================================== */
const DB_KEY = 'zezoLearnDB_v2';
const ADMIN_SESSION = 'zezoLearnAdminSession_v2';

const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const fmt = t => new Date(t).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
const fmtFull = t => new Date(t).toLocaleString('ar-EG');

  const Q = (id,subjectId,unitId,lessonId,text,options,correct,explanation,difficulty,points,tags)=>
    ({id,subjectId,unitId,lessonId,text,image:'',options,correct,explanation,difficulty,points,tags:tags||[]});

    },
    users:[], subjects:[
      {id:'sub_math',name:'الرياضيات',icon:'🧮',color:'#6C5CE7',order:1,visible:true},
      {id:'sub_sci', name:'العلوم',   icon:'🔬',color:'#22c55e',order:2,visible:true},
      {id:'sub_ar',  name:'اللغة العربية',icon:'📖',color:'#f59e0b',order:3,visible:true},
      {id:'sub_soc', name:'الدراسات', icon:'🌍',color:'#0ea5e9',order:4,visible:true},
      {id:'sub_en',  name:'اللغة الإنجليزية',icon:'🇬🇧',color:'#ef4444',order:5,visible:true}
    ],
    units:[
      {id:'u1',subjectId:'sub_math',name:'الوحدة الأولى: العمليات الأساسية',order:1},
      {id:'u2',subjectId:'sub_math',name:'الوحدة الثانية: الكسور',order:2},
      {id:'u3',subjectId:'sub_sci', name:'الوحدة الأولى: الكائنات الحية',order:1}
    ],
    lessons:[
      {id:'l1',unitId:'u1',subjectId:'sub_math',title:'الدرس الأول: الجمع والطرح',order:1,locked:false,
       content:'الجمع هو ضم مجموعتين للحصول على المجموع، والطرح هو إزالة كمية من كمية أخرى.',video:'',pdf:'',images:[]},
      {id:'l2',unitId:'u1',subjectId:'sub_math',title:'الدرس الثاني: الضرب والقسمة',order:2,locked:false,
       content:'الضرب هو جمع متكرر، والقسمة هي توزيع بالتساوي.',video:'',pdf:'',images:[]},
      {id:'l3',unitId:'u3',subjectId:'sub_sci',title:'الدرس الأول: الخلية',order:1,locked:false,
       content:'الخلية هي وحدة البناء الأساسية في الكائنات الحية.',video:'',pdf:'',images:[]}
    ],
    questions:[
      Q('q1','sub_math','u1','l1','ما ناتج 5 × 4 ؟',['10','15','20','25'],2,'لأن 5 × 4 = 20 (الضرب جمع متكرر).','easy',10,['ضرب']),
      Q('q2','sub_math','u1','l1','ما ناتج 12 + 8 ؟',['18','20','22','24'],1,'لأن 12 + 8 = 20.','easy',10,['جمع']),
      Q('q3','sub_math','u1','l1','ما ناتج 30 - 17 ؟',['12','13','14','15'],1,'لأن 30 - 17 = 13.','easy',10,['طرح']),
      Q('q4','sub_math','u1','l2','ما ناتج 36 ÷ 6 ؟',['5','6','7','8'],1,'لأن 6 × 6 = 36.','medium',15,['قسمة']),
      Q('q5','sub_math','u1','l2','ما ناتج 7 × 8 ؟',['54','56','58','64'],1,'لأن 7 × 8 = 56.','medium',15,['ضرب']),
      Q('q6','sub_math','u2','','ما هو 1/2 في صورة نسبة مئوية؟',['25%','40%','50%','75%'],2,'لأن 1/2 = 0.5 = 50%.','medium',15,['كسور']),
      Q('q7','sub_math','u2','','ما هو 3/4 + 1/4 ؟',['1/2','3/4','1','4/8'],2,'لأن 3+1 = 4، و 4/4 = 1.','medium',15,['كسور']),
      Q('q8','sub_math','','','ما هو العدد الأولي بين الأعداد التالية؟',['9','15','17','21'],2,'17 لا يقبل القسمة إلا على نفسه وعلى 1.','hard',20,['أعداد']),
      Q('q9','sub_math','','','إذا كان س + 5 = 12، فما قيمة س؟',['5','6','7','8'],2,'س = 12 - 5 = 7.','easy',10,['جبر']),
      Q('q10','sub_sci','u3','l3','ما هي وحدة البناء الأساسية في الكائنات الحية؟',['النسيج','الخلية','العضو','الجهاز'],1,'الخلية هي أصغر وحدة قادرة على الحياة.','easy',10,['أحياء']),
      Q('q11','sub_sci','u3','l3','ما الغاز الذي تحتاجه النباتات في عملية البناء الضوئي؟',['الأكسجين','النيتروجين','ثاني أكسيد الكربون','الهيدروجين'],2,'النبات يستهلك ثاني أكسيد الكربون وينتج الأكسجين.','easy',10,['نبات']),
      Q('q12','sub_sci','','','ما الكوكب الأقرب إلى الشمس؟',['الزهرة','عطارد','الأرض','المريخ'],1,'عطارد هو أقرب كوكب إلى الشمس.','easy',10,['فضاء']),
      Q('q13','sub_ar','','','ما نوع كلمة «كتاب» من حيث النوع؟',['مذكر','مؤنث','جمع','مثنى'],0,'«كتاب» مذكر.','easy',10,['لغة']),
      Q('q14','sub_ar','','','جمع كلمة «قلم» هو:',['أقلام','قلمون','قلمات','قلماء'],0,'جمع تكسير: أقلام.','easy',10,['لغة']),
      Q('q15','sub_soc','','','ما هي عاصمة مصر؟',['الإسكندرية','القاهرة','أسوان','المنصورة'],1,'القاهرة هي العاصمة.','easy',10,['جغرافيا']),
      Q('q16','sub_en','','','Choose: I ___ a student.',['am','is','are','be'],0,'مع I نستخدم am.','easy',10,['grammar'])
    ],
    quizzes:[
      {id:'qz1',name:'الجولة السهلة',subjectId:'sub_math',unitId:'',lessonId:'',desc:'5 أسئلة سريعة',
       questionIds:['q1','q2','q3','q9','q4'],random:false,count:5,time:0,points:10,locked:false},
      {id:'qz2',name:'تحدي الأبطال 💀',subjectId:'sub_math',unitId:'',lessonId:'',desc:'أسئلة قوية',
       questionIds:['q5','q6','q7','q8','q9'],random:false,count:5,time:120,points:20,locked:false},
      {id:'qz3',name:'جولة العلوم',subjectId:'sub_sci',unitId:'',lessonId:'',desc:'كل ما يخص العلوم',
       questionIds:['q10','q11','q12'],random:false,count:3,time:0,points:10,locked:false}
    ],
    notifications:[], activities:[], answerLog:[], suggestions:[], reports:[], polls:[], announcements:[],
    achievements:[
      {id:'a1',name:'أول 10 أسئلة',icon:'🥉',cond:'answered10',reward:20},
      {id:'a2',name:'أول 100 سؤال',icon:'🥈',cond:'answered100',reward:100},
      {id:'a3',name:'100 إجابة صحيحة',icon:'🧠',cond:'correct100',reward:150},
      {id:'a4',name:'7 أيام متتالية',icon:'🔥',cond:'streak7',reward:200},
      {id:'a5',name:'10 إجابات متتالية',icon:'⚡',cond:'combo10',reward:120},
      {id:'a6',name:'المركز الأول',icon:'👑',cond:'rank1',reward:300},
      {id:'a7',name:'أنهيت أول جولة',icon:'🎯',cond:'quiz1',reward:30},
      {id:'a8',name:'أسطورة المنصة',icon:'🏆',cond:'points5000',reward:500}
    ]
  };
}
let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){ DB = makeDefaultDB(); saveDB(); return DB; }
    DB = JSON.parse(raw);
    const d = makeDefaultDB();
    DB.settings = Object.assign(d.settings, DB.settings||{});
    ['users','subjects','units','lessons','questions','quizzes','notifications','activities','answerLog','suggestions','reports','achievements','polls','announcements']
      .forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=d[k]; });
    return DB;
  }catch(e){ DB = makeDefaultDB(); return DB; }
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ console.warn(e); } }

/* ==========================================================================
   جلسة الأدمن
   ========================================================================== */
let ADMIN = null;
function restoreAdmin(){
  if(sessionStorage.getItem(ADMIN_SESSION) === 'yes') ADMIN = {user: DB.settings.adminUser};
}
function loginAdmin(user, pass){
  if(user === DB.settings.adminUser && pass === DB.settings.adminPassword){
    ADMIN = {user};
    sessionStorage.setItem(ADMIN_SESSION,'yes');
    return true;
  }
  return false;
}
function logoutAdmin(){
  ADMIN = null;
  sessionStorage.removeItem(ADMIN_SESSION);
  state.page = 'dashboard';
  render();
}

/* ==========================================================================
   أدوات
   ========================================================================== */
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show '+(type||'');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast '+(type||''), 2400);
}
function openModal(h){ document.getElementById('modalBox').innerHTML = h; document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
document.getElementById('overlay').addEventListener('click', ()=>{
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
});
function applySettings(){
  const s = DB.settings;
  document.documentElement.style.setProperty('--primary', s.primaryColor||'#6C5CE7');
  document.documentElement.style.setProperty('--primary2', s.accentColor||'#a29bfe');
  document.title = (s.platformName||'منصة') + ' — لوحة الإدارة';
}
function confirmBox(msg, onYes, danger){
  openModal(`<h3>⚠️ تأكيد</h3>
    <p class="muted mb">${esc(msg)}</p>
    <div class="flex"><button class="btn ${danger?'bad':'ok'}" style="flex:1" id="okConfirm">نعم، تأكيد</button>
      <button class="btn ghost" style="flex:1" onclick="closeModal()">إلغاء</button></div>`);
  document.getElementById('okConfirm').onclick = ()=>{ closeModal(); onYes(); };
}

/* ==========================================================================
   قائمة التنقل
   ========================================================================== */
const NAV = [
  {k:'dashboard',   i:'📊', t:'لوحة التحكم'},
  {k:'settings',    i:'⚙️', t:'إعدادات المنصة'},
  {k:'students',    i:'👨‍🎓', t:'الطلاب'},
  {k:'subjects',    i:'📚', t:'المواد'},
  {k:'units',       i:'📖', t:'الوحدات'},
  {k:'lessons',     i:'📕', t:'الدروس'},
  {k:'questions',   i:'❓', t:'بنك الأسئلة'},
  {k:'quizzes',     i:'🔥', t:'الجولات والاختبارات'},
  {k:'notifications',i:'🔔',t:'الإشعارات'},
  {k:'announcements',i:'📢',t:'الإعلانات'},
  {k:'achievements',i:'🏅', t:'الإنجازات'},

let state = {page:'dashboard', params:{}};
function go(p, params){
  state.page = p;
  state.params = params||{};
  document.querySelector('.sidebar') && document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  window.scrollTo({top:0,behavior:'instant'});
  render();
}

function shell(content){
  const pendingSuggestions = DB.suggestions.filter(s=>s.status==='new').length;
  const pendingReports = DB.reports.filter(r=>r.status==='new').length;
  return `
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <span class="l-ic">${esc(DB.settings.logo)}</span>
        <span>${esc(DB.settings.platformName)}</span>
      </div>
      <nav>
        ${NAV.map(n=>{
          let badge = '';
          if(n.k==='suggestions' && pendingSuggestions) badge = ` <span class="pill" style="background:var(--bad);color:#fff;border:0">${pendingSuggestions}</span>`;
          if(n.k==='reports' && pendingReports) badge = ` <span class="pill" style="background:var(--bad);color:#fff;border:0">${pendingReports}</span>`;
          return `<button class="nav-btn ${state.page===n.k?'active':''}" data-act="go" data-p="${n.k}">
            <span class="n-ic">${n.i}</span><span>${n.t}</span>${badge}</button>`;

        </div>

          <button class="icon-btn" data-act="toggleTheme">${document.body.classList.contains('dark')?'☀️':'🌙'}</button>

      </div>
      ${content}
    </main>
  </div>`;
}

function dashboardView(){
  const users = DB.users.length;
  const active = DB.users.filter(u=>u.status==='active').length;
  const banned = DB.users.filter(u=>u.status==='banned').length;
  const subs = DB.subjects.length;
  const units = DB.units.length;
  const lessons = DB.lessons.length;
  const qs = DB.questions.length;
  const quizzes = DB.quizzes.length;
  const acts = DB.activities.length;
  const last24 = DB.activities.filter(a=>a.time > now() - 86400000).length;
  const totalPoints = DB.users.reduce((s,u)=>s+(u.points||0),0);
  const totalAnswers = DB.answerLog.length;
  const correctAnswers = DB.answerLog.filter(a=>a.correct).length;
  const acc = totalAnswers ? Math.round(correctAnswers/totalAnswers*100) : 0;

  const topStudents = [...DB.users].sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,5);
  const recentActs = DB.activities.slice(0,10);
  const topQs = {};
  DB.answerLog.forEach(a=>{ if(!a.correct){ topQs[a.qid]=(topQs[a.qid]||0)+1; }});
  const hardestQs = Object.entries(topQs).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([qid,n])=>({q: DB.questions.find(x=>x.id===qid), n})).filter(x=>x.q);

  return `
  <div class="grid g4 mb">
    <div class="stat-box"><div class="s-ic">👨‍🎓</div><div class="s-t"><b>${users}</b><span>إجمالي الطلاب</span></div></div>
    <div class="stat-box"><div class="s-ic" style="background:linear-gradient(135deg,#22c55e,#16a34a)">🟢</div><div class="s-t"><b>${active}</b><span>حسابات نشطة</span></div></div>
    <div class="stat-box"><div class="s-ic" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">🔴</div><div class="s-t"><b>${banned}</b><span>حسابات موقوفة</span></div></div>
    <div class="stat-box"><div class="s-ic" style="background:linear-gradient(135deg,#f59e0b,#d97706)">⭐</div><div class="s-t"><b>${totalPoints}</b><span>مجموع النقاط</span></div></div>
    <div class="stat-box"><div class="s-ic">📚</div><div class="s-t"><b>${subs}</b><span>مواد</span></div></div>
    <div class="stat-box"><div class="s-ic">📖</div><div class="s-t"><b>${units}</b><span>وحدات</span></div></div>
    <div class="stat-box"><div class="s-ic">📕</div><div class="s-t"><b>${lessons}</b><span>دروس</span></div></div>
    <div class="stat-box"><div class="s-ic">❓</div><div class="s-t"><b>${qs}</b><span>أسئلة</span></div></div>
    <div class="stat-box"><div class="s-ic">🔥</div><div class="s-t"><b>${quizzes}</b><span>جولات</span></div></div>
    <div class="stat-box"><div class="s-ic">📜</div><div class="s-t"><b>${acts}</b><span>نشاطات</span></div></div>
    <div class="stat-box"><div class="s-ic">🕒</div><div class="s-t"><b>${last24}</b><span>نشاط آخر 24س</span></div></div>
    <div class="stat-box"><div class="s-ic">✅</div><div class="s-t"><b>${acc}%</b><span>نسبة الإجابات الصحيحة</span></div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-t"><span>🏆 أعلى 5 طلاب</span></div>
      ${topStudents.length ? topStudents.map((u,i)=>`
        <div class="row">
          <span class="av">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span>
          <div class="m"><b>${esc(u.name)}</b><span>@${esc(u.username)} • ${u.points||0} نقطة</span></div>
        </div>`).join('') : '<p class="muted">لا يوجد طلاب بعد</p>'}
    </div>
    <div class="card">
      <div class="card-t"><span>📜 آخر النشاطات</span><button class="btn ghost sm" data-act="go" data-p="activity">عرض الكل</button></div>
      ${recentActs.length ? recentActs.map(a=>`
        <div class="row">
          <span class="av" style="font-size:14px">${iconForAct(a.type)}</span>
          <div class="m"><b>${esc(a.userName)}</b><span>${esc(a.detail||a.type)}</span><span>${fmt(a.time)}</span></div>
        </div>`).join('') : '<p class="muted">لا يوجد نشاط بعد</p>'}
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-t"><span>💀 أصعب 5 أسئلة</span></div>
      ${hardestQs.length ? hardestQs.map(({q,n})=>`
        <div class="row">
          <span class="av">❌</span>
          <div class="m"><b>${esc(q.text.slice(0,60))}</b><span>${n} إجابة خاطئة</span></div>
        </div>`).join('') : '<p class="muted">لا توجد بيانات</p>'}
    </div>
    <div class="card">
      <div class="card-t"><span>🚀 إجراءات سريعة</span></div>
      <div class="grid g2" style="gap:8px">
        <button class="btn block" data-act="quickAdd" data-t="question">➕ سؤال</button>
        <button class="btn block" data-act="quickAdd" data-t="subject">➕ مادة</button>
        <button class="btn block ghost" data-act="quickAdd" data-t="quiz">➕ جولة</button>
        <button class="btn block ghost" data-act="quickAdd" data-t="notification">🔔 إشعار</button>
      </div>
    </div>
  </div>`;
}

  return {login:'🔑',logout:'🚪',register:'✅',lesson:'📖',correct:'✅',wrong:'❌',quiz:'🏆',achievement:'🏅'}[t] || '📌';

function studentsView(){
  const q = (state.params.q||'').toLowerCase();

  if(q) list = list.filter(u=>u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q));

  return `

    <div class="flex-between mb">

  <div class="card">

    ${list.length ? `
      <div style="overflow-x:auto">

        <thead><tr>
          <th>#</th><th>الطالب</th><th>النقاط</th><th>المستوى</th>
          <th>الدقة</th><th>الحالة</th><th>آخر دخول</th><th>إجراءات</th>
        </tr></thead>
        <tbody>
          ${list.map((u,i)=>{
            const st = u.stats||{answered:0,correct:0};
            const acc = st.answered ? Math.round(st.correct/st.answered*100) : 0;
            const lv = levelOf(u.points||0);
            return `<tr>
              <td>${i+1}</td>
              <td><b>${esc(u.name)}</b><br><span class="muted">@${esc(u.username)}</span></td>
              <td><b>${u.points||0}</b></td>

              <td>${u.lastLogin?fmt(u.lastLogin):'—'}</td>

              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>` : '<div class="empty"><span class="e">👥</span>لا يوجد طلاب</div>'}
  </div>`;
}

            const u = DB.units.find(x=>x.id===l.unitId);

function questionsView(){
  const qs = state.params.q || '';
  const fSub = state.params.subjectId || '';

  let list = [...DB.questions];
  if(qs) list = list.filter(x=>x.text.includes(qs));
  if(fSub) list = list.filter(x=>x.subjectId===fSub);
  if(fDiff) list = list.filter(x=>x.difficulty===fDiff);

  return `
  <div class="card">
    <div class="card-t"><span>❓ بنك الأسئلة (${DB.questions.length})</span>
      <div class="flex" style="gap:7px">
        <button class="btn sm ghost" data-act="bulkImport">📥 استيراد</button>
        <button class="btn sm" data-act="addQuestion">➕ سؤال جديد</button>
      </div>
    </div>
    <div class="grid g2 mb">
      <input class="inp" id="searchQ" placeholder="🔍 ابحث في نص السؤال..." value="${esc(qs)}">
      <select class="inp" id="filterQSub">
        <option value="">كل المواد</option>
        ${DB.subjects.map(s=>`<option value="${s.id}" ${fSub===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
      </select>
      <select class="inp" id="filterQDiff">
        <option value="">كل المستويات</option>
        <option value="easy" ${fDiff==='easy'?'selected':''}>سهل</option>
        <option value="medium" ${fDiff==='medium'?'selected':''}>متوسط</option>
        <option value="hard" ${fDiff==='hard'?'selected':''}>صعب</option>
      </select>
      <button class="btn ghost" data-act="clearFilters">🔄 مسح الفلاتر</button>
    </div>
    <p class="muted mb">يظهر ${list.length} سؤال</p>

    ${list.length ? list.map(q=>{
      const s = DB.subjects.find(x=>x.id===q.subjectId);
      const used = DB.quizzes.filter(qz=>(qz.questionIds||[]).includes(q.id)).length;
      const correctCount = DB.answerLog.filter(a=>a.qid===q.id && a.correct).length;
      const wrongCount = DB.answerLog.filter(a=>a.qid===q.id && !a.correct).length;
      return `<div class="card" style="border-right:4px solid ${esc(s?s.color:'#ccc')};padding:13px;margin-bottom:9px">
        <div class="flex-between mb">
          <div>
            ${s?`<span class="chip">${esc(s.icon)} ${esc(s.name)}</span>`:''}
            <span class="chip">${q.difficulty==='easy'?'🟢 سهل':q.difficulty==='hard'?'🔴 صعب':'🟡 متوسط'}</span>
            <span class="chip">⭐ ${q.points||10}</span>
          </div>
        </div>
        <div style="font-weight:800;margin-bottom:9px;font-size:15px">${esc(q.text)}</div>
        <div class="grid" style="gap:5px;margin-bottom:9px">
          ${q.options.map((op,i)=>`<div class="${i===q.correct?'opt-correct':''}"
            style="padding:7px 11px;border-radius:10px;background:${i===q.correct?'rgba(34,197,94,.15)':'var(--bg)'};
            border:1px solid ${i===q.correct?'var(--ok)':'var(--border)'};font-size:13px">
            <b>${['A','B','C','D'][i]}.</b> ${esc(op)} ${i===q.correct?'✓':''}
          </div>`).join('')}
        </div>
        ${q.explanation?`<div class="muted" style="background:rgba(108,92,231,.08);padding:9px;border-radius:10px;font-size:12.5px">
          🧠 <b>التفسير:</b> ${esc(q.explanation)}</div>`:''}
        <div class="flex mt" style="gap:7px;flex-wrap:wrap">
          <span class="pill">✅ ${correctCount}</span>
          <span class="pill">❌ ${wrongCount}</span>
          <span class="pill">🎯 في ${used} جولة</span>
        </div>
        <div class="flex mt" style="gap:7px;flex-wrap:wrap">

          <button class="btn sm bad" data-act="delQuestion" data-id="${q.id}">🗑️ حذف</button>
        </div>
      </div>`;
    }).join('') : '<div class="empty"><span class="e">📭</span>لا توجد أسئلة مطابقة</div>'}
  </div>`;
}

/* ==========================================================================
   التحليلات
   ========================================================================== */
function analyticsView(){
  const totalAns = DB.answerLog.length;
  const correctAns = DB.answerLog.filter(a=>a.correct).length;
  const wrongAns = totalAns - correctAns;
  const acc = totalAns ? Math.round(correctAns/totalAns*100) : 0;

  const subStats = {};
  DB.answerLog.forEach(a=>{
    const q = DB.questions.find(x=>x.id===a.qid);
    if(!q) return;
    const s = q.subjectId;
    if(!subStats[s]) subStats[s] = {correct:0, total:0};
    subStats[s].total++;
    if(a.correct) subStats[s].correct++;
  });

  const qStats = {};
  DB.answerLog.forEach(a=>{
    if(!qStats[a.qid]) qStats[a.qid] = {correct:0, total:0};
    qStats[a.qid].total++;
    if(a.correct) qStats[a.qid].correct++;
  });
  const hardest = Object.entries(qStats).map(([qid,s])=>({
    q: DB.questions.find(x=>x.id===qid),
    pct: Math.round(s.correct/s.total*100),
    total: s.total
  })).filter(x=>x.q && x.total >= 3).sort((a,b)=>a.pct-b.pct).slice(0,10);

  const easiest = Object.entries(qStats).map(([qid,s])=>({
    q: DB.questions.find(x=>x.id===qid),
    pct: Math.round(s.correct/s.total*100),
    total: s.total
  })).filter(x=>x.q && x.total >= 3).sort((a,b)=>b.pct-a.pct).slice(0,10);

  const topStudents = [...DB.users].sort((a,b)=>(b.stats&&b.stats.correct||0)-(a.stats&&a.stats.correct||0)).slice(0,10);
  const last7 = [];
  for(let i=6; i>=0; i--){
    const d = new Date(); d.setDate(d.getDate()-i); d.setHours(0,0,0,0);
    const from = d.getTime(); const to = from + 86400000;
    const c = DB.answerLog.filter(a=>a.time>=from && a.time<to).length;
    last7.push({label: d.toLocaleDateString('ar-EG',{weekday:'short'}), c});
  }
  const maxC = Math.max(1, ...last7.map(x=>x.c));

  return `
  <div class="grid g4 mb">
    <div class="stat-box"><div class="s-ic">📊</div><div class="s-t"><b>${totalAns}</b><span>إجمالي الإجابات</span></div></div>
    <div class="stat-box"><div class="s-ic" style="background:linear-gradient(135deg,#22c55e,#16a34a)">✅</div><div class="s-t"><b>${correctAns}</b><span>صحيحة</span></div></div>
    <div class="stat-box"><div class="s-ic" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">❌</div><div class="s-t"><b>${wrongAns}</b><span>خاطئة</span></div></div>
    <div class="stat-box"><div class="s-ic">🎯</div><div class="s-t"><b>${acc}%</b><span>الدقة العامة</span></div></div>
  </div>

  <div class="card">
    <div class="card-t"><span>📈 الإجابات آخر 7 أيام</span></div>
    <div class="flex" style="align-items:flex-end;gap:9px;height:160px">
      ${last7.map(x=>`<div style="flex:1;text-align:center">
        <div style="height:${Math.max(6,x.c/maxC*120)}px;background:linear-gradient(180deg,var(--primary),var(--primary2));border-radius:9px 9px 4px 4px"></div>
        <div style="font-size:11px;color:var(--muted);margin-top:5px">${x.label}</div>
        <div style="font-size:10.5px;font-weight:800">${x.c}</div></div>`).join('')}
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-t"><span>📚 أداء المواد</span></div>
      ${Object.keys(subStats).length ? Object.entries(subStats).map(([sid,s])=>{
        const sub = DB.subjects.find(x=>x.id===sid);
        const p = Math.round(s.correct/s.total*100);
        return `<div class="mb">
          <div class="flex-between" style="margin-bottom:5px">
            <b>${sub?esc(sub.icon+' '+sub.name):'—'}</b>
            <span class="muted">${p}% (${s.correct}/${s.total})</span>
          </div>
          <div class="bar"><i style="width:${p}%;background:${p>=70?'var(--ok)':p>=40?'var(--warn)':'var(--bad)'}"></i></div>
        </div>`;
      }).join('') : '<p class="muted center">لا توجد بيانات</p>'}
    </div>
    <div class="card">
      <div class="card-t"><span>🏆 أكثر الطلاب نشاطًا</span></div>
      ${topStudents.length ? topStudents.map((u,i)=>`
        <div class="row">
          <span class="av">${i+1}</span>
          <div class="m"><b>${esc(u.name)}</b><span>${u.stats?u.stats.correct:0} إجابة صحيحة • ${u.points||0} نقطة</span></div>
        </div>`).join('') : '<p class="muted center">لا يوجد طلاب</p>'}
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="card-t"><span>💀 أصعب الأسئلة</span></div>
      ${hardest.length ? hardest.map(h=>`
        <div class="mb">
          <div class="flex-between" style="margin-bottom:5px">
            <b style="font-size:12.5px">${esc(h.q.text.slice(0,50))}</b>
            <span class="muted">${h.pct}%</span>
          </div>
          <div class="bar"><i style="width:${h.pct}%;background:${h.pct<40?'var(--bad)':h.pct<70?'var(--warn)':'var(--ok)'}"></i></div>
        </div>`).join('') : '<p class="muted center">لا توجد بيانات كافية</p>'}
    </div>
    <div class="card">
      <div class="card-t"><span>🟢 أسهل الأسئلة</span></div>
      ${easiest.length ? easiest.map(h=>`
        <div class="mb">
          <div class="flex-between" style="margin-bottom:5px">
            <b style="font-size:12.5px">${esc(h.q.text.slice(0,50))}</b>
            <span class="muted">${h.pct}%</span>
          </div>
          <div class="bar"><i style="width:${h.pct}%;background:var(--ok)"></i></div>
        </div>`).join('') : '<p class="muted center">لا توجد بيانات كافية</p>'}
    </div>
  </div>`;
}

function render(){
  applySettings();
  const app = document.getElementById('app');
  if(!ADMIN){ app.innerHTML = loginView(); return; }

  let content = '';
  switch(state.page){
    case 'dashboard': content = dashboardView(); break;
    case 'settings': content = settingsView(); break;
    case 'students': content = studentsView(); break;
    case 'subjects': content = subjectsView(); break;
    case 'units': content = unitsView(); break;
    case 'lessons': content = lessonsView(); break;
    case 'questions': content = questionsView(); break;
    case 'quizzes': content = quizzesView(); break;
    case 'notifications': content = notificationsView(); break;
    case 'announcements': content = announcementsView(); break;
    case 'achievements': content = achievementsView(); break;
    case 'activity': content = activityView(); break;
    case 'analytics': content = analyticsView(); break;
    case 'suggestions': content = suggestionsView(); break;
    case 'reports': content = reportsView(); break;
    case 'polls': content = pollsView(); break;
    case 'preview': content = previewView(); break;
    case 'backup': content = backupView(); break;
    default: content = dashboardView();
  }
  app.innerHTML = shell(content);
  bindDynamic();
}

function bindDynamic(){
  const ft = document.getElementById('filterSub');
  if(ft) ft.onchange = e => go('units', {subjectId: e.target.value});
  const fu = document.getElementById('filterUnit');
  if(fu) fu.onchange = e => go('lessons', {unitId: e.target.value});
  const sq = document.getElementById('searchQ');
  if(sq){
    sq.oninput = e => {
      clearTimeout(sq._t);
      sq._t = setTimeout(()=>{
        state.params.q = e.target.value;
        state.params.subjectId = document.getElementById('filterQSub').value;
        state.params.diff = document.getElementById('filterQDiff').value;
        render();
      }, 300);
    };
  }
  const fqs = document.getElementById('filterQSub');
  if(fqs) fqs.onchange = e => { state.params.subjectId = e.target.value; state.params.q = document.getElementById('searchQ').value; state.params.diff = document.getElementById('filterQDiff').value; render(); };
  const fqd = document.getElementById('filterQDiff');
  if(fqd) fqd.onchange = e => { state.params.diff = e.target.value; state.params.q = document.getElementById('searchQ').value; state.params.subjectId = document.getElementById('filterQSub').value; render(); };

  const ss = document.getElementById('searchStd');
  if(ss){
    ss.oninput = e => { clearTimeout(ss._t); ss._t = setTimeout(()=>{ state.params.q = e.target.value; render(); }, 300); };
  }

  const at = document.getElementById('actType');
  if(at) at.onchange = e => { state.params.type = e.target.value; render(); };
  const au = document.getElementById('actUser');
  if(au) au.onchange = e => { state.params.userId = e.target.value; render(); };

  const nWhen = document.getElementById('nWhen');
  if(nWhen) nWhen.onchange = e => { document.getElementById('nSchedWrap').style.display = e.target.value === 'schedule' ? 'block' : 'none'; };

  const pc = document.getElementById('setPrimary');
  const pct = document.getElementById('setPrimaryTxt');
  if(pc && pct){ pc.oninput = e => pct.value = e.target.value; pct.oninput = e => pc.value = e.target.value; }
  const ac = document.getElementById('setAccent');
  const act = document.getElementById('setAccentTxt');
  if(ac && act){ ac.oninput = e => act.value = e.target.value; act.oninput = e => ac.value = e.target.value; }
}

/* ==========================================================================
   Events
   ========================================================================== */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  const id = t.dataset.id;

  switch(act){
    case 'go': go(t.dataset.p); break;
    case 'toggleSide':
      document.querySelector('.sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
      break;
    case 'toggleTheme':
      document.body.classList.toggle('dark');
      localStorage.setItem('zezo_theme_admin', document.body.classList.contains('dark')?'dark':'light');
      render(); break;
    case 'logout':
      confirmBox('هل تريد تسجيل الخروج من لوحة الإدارة؟', ()=>logoutAdmin()); break;
    case 'refreshData': loadDB(); toast('✅ تم تحديث البيانات','ok'); render(); break;

    case 'saveSettings': {
      const s = DB.settings;
      s.platformName = document.getElementById('setName').value.trim() || 'منصة';
      s.logo = document.getElementById('setLogo').value.trim() || '🚀';
      s.primaryColor = document.getElementById('setPrimaryTxt').value.trim() || '#6C5CE7';
      s.accentColor = document.getElementById('setAccentTxt').value.trim() || '#a29bfe';
      s.description = document.getElementById('setDesc').value.trim();
      s.welcome = document.getElementById('setWelcome').value.trim();
      s.footer = document.getElementById('setFooter').value.trim();
      saveDB(); toast('✅ تم حفظ الإعدادات','ok'); render(); break;
    }
    case 'saveOptions': {
      const s = DB.settings;
      s.showVideo = document.getElementById('optVideo').checked;
      s.showPdf = document.getElementById('optPdf').checked;
      s.showImages = document.getElementById('optImages').checked;
      s.allowRegister = document.getElementById('optRegister').checked;
      s.maintenance = document.getElementById('optMaint').checked;
      saveDB(); toast('✅ تم حفظ الخيارات','ok'); break;
    }
    case 'saveAdmin': {
      const u = document.getElementById('setAdminUser').value.trim();
      const p = document.getElementById('setAdminPass').value.trim();
      if(!u || !p) return toast('املأ الحقول','bad');
      DB.settings.adminUser = u;
      DB.settings.adminPassword = p;
      saveDB(); toast('✅ تم التحديث','ok'); break;
    }
    case 'quickAdd': {
      const t2 = t.dataset.t;
      if(t2==='question') addQuestionModal();
      if(t2==='subject') addSubjectModal();
      if(t2==='quiz') addQuizModal();
      if(t2==='notification') go('notifications');
      break;
    }

    /* المواد */
    case 'addSubject': addSubjectModal(); break;
    case 'editSubject': editSubjectModal(id); break;
    case 'toggleSubject': {
      const s = DB.subjects.find(x=>x.id===id);
      if(s){ s.visible = s.visible === false; saveDB(); render(); }
      break;
    }
    case 'delSubject':
      confirmBox('سيتم حذف المادة وكل ما يتعلق بها. متابعة؟', ()=>{
        DB.subjects = DB.subjects.filter(x=>x.id!==id);
        DB.units = DB.units.filter(u=>u.subjectId!==id);
        DB.lessons = DB.lessons.filter(l=>l.subjectId!==id);
        DB.questions = DB.questions.filter(q=>q.subjectId!==id);
        DB.quizzes = DB.quizzes.filter(q=>q.subjectId!==id);
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;

    /* الوحدات */
    case 'addUnit': addUnitModal(); break;
    case 'editUnit': editUnitModal(id); break;
    case 'delUnit':
      confirmBox('سيتم حذف الوحدة ودروسها. متابعة؟', ()=>{
        DB.units = DB.units.filter(u=>u.id!==id);
        DB.lessons = DB.lessons.filter(l=>l.unitId!==id);
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;

    /* الدروس */
    case 'addLesson': addLessonModal(); break;
    case 'editLesson': editLessonModal(id); break;
    case 'toggleLesson': {
      const l = DB.lessons.find(x=>x.id===id);
      if(l){ l.locked = !l.locked; saveDB(); render(); }
      break;
    }
    case 'delLesson':
      confirmBox('حذف الدرس؟', ()=>{
        DB.lessons = DB.lessons.filter(x=>x.id!==id);
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;

    /* الأسئلة */
    case 'addQuestion': addQuestionModal(); break;
    case 'editQuestion': editQuestionModal(id); break;
    case 'dupQuestion': {
      const q = DB.questions.find(x=>x.id===id);
      if(q){ const copy = {...q, id: uid('q')}; DB.questions.push(copy); saveDB(); toast('✅ تم النسخ','ok'); render(); }
      break;
    }
    case 'delQuestion':
      confirmBox('حذف السؤال؟', ()=>{
        DB.questions = DB.questions.filter(x=>x.id!==id);
        DB.quizzes.forEach(q=>{ q.questionIds = (q.questionIds||[]).filter(x=>x!==id); });
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;
    case 'bulkImport': bulkImportModal(); break;
    case 'clearFilters': state.params = {}; render(); break;

    /* الجولات */
    case 'addQuiz': addQuizModal(); break;
    case 'editQuiz': editQuizModal(id); break;
    case 'toggleQuiz': {
      const q = DB.quizzes.find(x=>x.id===id);
      if(q){ q.locked = !q.locked; saveDB(); render(); }
      break;
    }
    case 'delQuiz':
      confirmBox('حذف الجولة؟', ()=>{
        DB.quizzes = DB.quizzes.filter(x=>x.id!==id);
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;

    /* الإشعارات */
    case 'sendNotif': {
      const type = document.getElementById('nType').value;
      const title = document.getElementById('nTitle').value.trim();
      const body = document.getElementById('nBody').value.trim();
      const target = document.getElementById('nTarget').value;
      const when = document.getElementById('nWhen').value;
      if(!title || !body) return toast('املأ العنوان والنص','bad');
      let sendAt = now();
      if(when === 'schedule'){
        const dt = document.getElementById('nSched').value;
        if(!dt) return toast('حدد وقت الإرسال','bad');
        sendAt = new Date(dt).getTime();
      }
      DB.notifications.push({id:uid('n'), type, title, body, target, time: sendAt});
      saveDB();
      toast('✅ تم إرسال الإشعار','ok');
      render();
      break;
    }
    case 'delNotif':
      DB.notifications = DB.notifications.filter(n=>n.id!==id);
      saveDB(); render(); break;
    case 'clearNotifs':
      confirmBox('مسح كل الإشعارات؟', ()=>{ DB.notifications = []; saveDB(); render(); }, true); break;

    /* الإعلانات */
    case 'saveAnnouncement': {
      const title = document.getElementById('anTitle').value.trim();
      const body = document.getElementById('anBody').value.trim();
      const priority = document.getElementById('anPriority').value;
      const days = parseInt(document.getElementById('anDays').value)||7;
      if(!title || !body) return toast('املأ الحقول','bad');
      DB.announcements.push({id:uid('an'), title, body, priority, createdAt: now(), expires: now()+days*86400000});
      saveDB(); toast('✅ تم النشر','ok'); render(); break;
    }
    case 'delAnnouncement':
      DB.announcements = DB.announcements.filter(a=>a.id!==id);
      saveDB(); render(); break;

    /* الإنجازات */
    case 'addAchievement': addAchievementModal(); break;
    case 'editAchievement': editAchievementModal(id); break;
    case 'delAchievement':
      confirmBox('حذف الإنجاز؟', ()=>{
        DB.achievements = DB.achievements.filter(a=>a.id!==id);
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;

    /* الطلاب */
    case 'viewStudent': viewStudentModal(id); break;
    case 'notifyStudent': notifyStudentModal(id); break;
    case 'toggleStd': {
      const u = DB.users.find(x=>x.id===id);
      if(u){ u.status = u.status === 'banned' ? 'active' : 'banned'; saveDB(); render(); }
      break;
    }
    case 'delStudent':
      confirmBox('حذف الطالب نهائيًا؟', ()=>{
        DB.users = DB.users.filter(x=>x.id!==id);
        saveDB(); toast('✅ تم الحذف','ok'); render();
      }, true);
      break;
    case 'clearStdSearch': state.params.q = ''; render(); break;

    /* سجل النشاط */
    case 'clearActivity':
      confirmBox('مسح كل سجل النشاط؟', ()=>{ DB.activities = []; saveDB(); render(); }, true); break;

    /* الاقتراحات */
    case 'markSg': {
      const s = DB.suggestions.find(x=>x.id===id);
      if(s){ s.status = s.status==='new'?'read':'new'; saveDB(); render(); }
      break;
    }
    case 'delSg':
      DB.suggestions = DB.suggestions.filter(x=>x.id!==id);
      saveDB(); render(); break;
    case 'replySg': {
      const s = DB.suggestions.find(x=>x.id===id);
      if(!s) return;
      openModal(`<h3>↩️ رد على ${esc(s.userName)}</h3>
        <div class="field"><label>الرد</label><textarea class="inp" id="replyText"></textarea></div>
        <button class="btn block" id="sendReply">📩 إرسال الرد</button>`);
      document.getElementById('sendReply').onclick = ()=>{
        const text = document.getElementById('replyText').value.trim();
        if(!text) return toast('اكتب الرد','bad');
        DB.notifications.push({id:uid('n'), type:'announcement', title:'رد الإدارة', body: text, target: s.userId, time: now(), userId: s.userId});
        s.status = 'read';
        saveDB(); closeModal(); toast('✅ تم الإرسال','ok'); render();
      };
      break;
    }

    /* البلاغات */
    case 'markRp': {
      const r = DB.reports.find(x=>x.id===id);
      if(r){ r.status = 'done'; saveDB(); render(); }
      break;
    }
    case 'delRp':
      DB.reports = DB.reports.filter(x=>x.id!==id);
      saveDB(); render(); break;

    /* التصويت */
    case 'savePoll': {
      const q = document.getElementById('pollQ').value.trim();
      const opts = document.getElementById('pollOpts').value.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!q || opts.length < 2) return toast('املأ السؤال وخيارين على الأقل','bad');
      DB.polls.push({id:uid('poll'), q, options: opts, votes: [], createdAt: now()});
      saveDB(); toast('✅ تم النشر','ok'); render(); break;
    }
    case 'delPoll':
      DB.polls = DB.polls.filter(x=>x.id!==id);
      saveDB(); render(); break;

    /* النسخ */
    case 'exportData': {
      const data = JSON.stringify(DB, null, 2);
      const blob = new Blob([data], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'zezo-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      toast('📥 تم التصدير','ok');
      break;
    }
    case 'importData': document.getElementById('importFile').click(); break;
    case 'resetExceptUsers':
      confirmBox('مسح كل المحتوى مع الاحتفاظ بالطلاب؟', ()=>{
        DB.subjects = []; DB.units = []; DB.lessons = []; DB.questions = []; DB.quizzes = [];
        DB.activities = []; DB.answerLog = []; DB.notifications = []; DB.announcements = [];
        saveDB(); toast('✅ تم المسح','ok'); render();
      }, true);
      break;
    case 'resetAll':
      confirmBox('⚠️ سيتم حذف كل شيء! هل أنت متأكد؟', ()=>{
        localStorage.removeItem(DB_KEY);
        localStorage.removeItem('zezoLearnSession_v2');
        loadDB(); toast('💥 تم التصفير','ok'); render();
      }, true);
      break;
  }
});

document.addEventListener('change', e=>{
  if(e.target.id === 'importFile'){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(!data.settings || !Array.isArray(data.users)) throw new Error('ملف غير صالح');
        DB = data;
        saveDB(); toast('✅ تم الاستيراد','ok'); render();
      }catch(err){ toast('❌ ملف غير صالح', 'bad'); }
    };
    r.readAsText(f);
  }
});

document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form]');
  if(!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  if(f.dataset.form === 'adminLogin'){
    const u = (fd.get('user')||'').trim();
    const p = (fd.get('pass')||'').trim();
    if(loginAdmin(u, p)){ toast('👑 أهلاً بك', 'ok'); render(); }
    else toast('بيانات غير صحيحة', 'bad');
  }
});

function addSubjectModal(){
  openModal(`<h3>➕ مادة جديدة</h3>

function bulkImportModal(){
  openModal(`<h3>📥 استيراد أسئلة</h3>
    <p class="muted mb">الصق كل سؤال في سطر بالشكل:<br>
    <code style="font-size:11px">السؤال | A | B | C | D | رقم الإجابة(0-3) | التفسير</code></p>
    <div class="field"><label>المادة</label><select class="inp" id="bi_sub">
      <option value="">— بدون —</option>
      ${DB.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>الأسئلة</label><textarea class="inp" id="bi_text" style="min-height:220px" placeholder="ما ناتج 2+2؟ | 3 | 4 | 5 | 6 | 1 | لأن 2+2=4"></textarea></div>
    <button class="btn block" id="doImport">📥 استيراد</button>`);
  document.getElementById('doImport').onclick = ()=>{
    const lines = document.getElementById('bi_text').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const subId = document.getElementById('bi_sub').value;
    let count = 0;
    lines.forEach(line=>{
      const parts = line.split('|').map(p=>p.trim());
      if(parts.length < 6) return;
      const [text,a,b,c,d,correct,exp] = parts;
      if(!text || !a || !b || !c || !d) return;
      const ci = parseInt(correct);
      if(isNaN(ci) || ci < 0 || ci > 3) return;
      DB.questions.push({
        id: uid('q'), subjectId: subId, unitId:'', lessonId:'',
        text, image:'', options:[a,b,c,d], correct: ci,
        explanation: exp||'', difficulty:'medium', points:10, tags:[]
      });
      count++;
    });
    saveDB();
    closeModal();
    toast(`✅ تم استيراد ${count} سؤال`,'ok');
    render();
  };
}

  };
}
function viewStudentModal(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  const st = u.stats||{answered:0,correct:0};
  const acc = st.answered ? Math.round(st.correct/st.answered*100) : 0;
  const lv = levelOf(u.points||0);
  const recent = DB.activities.filter(a=>a.userId===u.id).slice(0,15);
  openModal(`<h3>👤 ${esc(u.name)}</h3>
    <div class="grid g2 mb">
      <div class="stat-box"><div class="s-t"><b>${u.points||0}</b><span>نقطة</span></div></div>
      <div class="stat-box"><div class="s-t"><b>${lv.i} ${lv.k}</b><span>المستوى</span></div></div>
      <div class="stat-box"><div class="s-t"><b>${acc}%</b><span>الدقة</span></div></div>
      <div class="stat-box"><div class="s-t"><b>${(u.badges||[]).length}</b><span>إنجاز</span></div></div>
    </div>
    <p class="muted">@${esc(u.username)} • ${u.status==='banned'?'🔴 موقوف':'🟢 نشط'}</p>
    <p class="muted">التسجيل: ${fmtFull(u.createdAt)} • آخر دخول: ${u.lastLogin?fmtFull(u.lastLogin):'—'}</p>
    <p class="muted">🔥 سلسلة: ${u.streak||0} يوم</p>
    <h3 style="margin-top:14px">📜 آخر الأنشطة</h3>
    ${recent.map(a=>`<div class="row"><span class="av">${iconForAct(a.type)}</span>
      <div class="m"><b>${esc(a.detail||a.type)}</b><span>${fmtFull(a.time)}</span></div></div>`).join('') || '<p class="muted">لا يوجد نشاط</p>'}`);
}
function notifyStudentModal(id){
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  openModal(`<h3>🔔 إشعار لـ ${esc(u.name)}</h3>
    <div class="field"><label>العنوان</label><input class="inp" id="ns_t"></div>
    <div class="field"><label>النص</label><textarea class="inp" id="ns_b"></textarea></div>
    <button class="btn block" id="sendNs">📩 إرسال</button>`);
  document.getElementById('sendNs').onclick = ()=>{
    const title = document.getElementById('ns_t').value.trim();
    const body = document.getElementById('ns_b').value.trim();
    if(!title || !body) return toast('املأ الحقول','bad');
    DB.notifications.push({id: uid('n'), type:'announcement', title, body, target: id, time: now(), userId: id});
    saveDB(); closeModal(); toast('✅ تم الإرسال','ok');
  };
}

/* ==========================================================================
   Init
   ========================================================================== */
(function init(){
  if(localStorage.getItem('zezo_theme_admin')==='dark') document.body.classList.add('dark');
  loadDB();
  restoreAdmin();
  render();
  window.addEventListener('storage', e=>{
    if(e.key === DB_KEY){ loadDB(); render(); }
  });
})();
</script>
</body>
</html>
