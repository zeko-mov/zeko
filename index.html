<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>منصة الطلاب</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--primary:#6C5CE7;--primary2:#a29bfe;--bg:#f1f2f9;--card:#fff;--text:#151a2d;--muted:#71788f;--border:#e5e7f2;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--r:18px;--sh:0 6px 22px rgba(20,20,60,.07)}
body.dark{--bg:#0c0f1d;--card:#151a2e;--text:#e9ebf7;--muted:#98a0bd;--border:#242a45;--sh:0 6px 22px rgba(0,0,0,.4)}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:92px;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.container{max-width:960px;margin:0 auto;padding:14px}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;min-width:0}
.brand .logo{width:38px;height:38px;min-width:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary2));font-size:20px}
.brand .pname{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:17px;position:relative;border:1px solid var(--border)}
.dot{position:absolute;top:-5px;left:-5px;background:var(--bad);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:7px 4px 9px}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);flex:1;padding:4px 2px;border-radius:12px;transition:.2s}
.bottomnav button.active{color:var(--primary);font-weight:700;background:rgba(108,92,231,.09)}
.bottomnav .ic{font-size:19px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;box-shadow:var(--sh);margin-bottom:13px}
.card-t{font-weight:800;font-size:15.5px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 28px rgba(108,92,231,.32);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;background:rgba(255,255,255,.12);border-radius:50%;top:-70px;left:-45px}
.hero h2{font-size:20px;margin-bottom:5px}
.hero p{opacity:.92;font-size:13.5px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px;position:relative;z-index:2}
.hero-stats div{background:rgba(255,255,255,.18);border-radius:14px;padding:9px;text-align:center;backdrop-filter:blur(5px)}
.hero-stats b{display:block;font-size:18px}
.hero-stats span{font-size:11px;opacity:.9}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--sh);transition:.18s;cursor:pointer;text-align:right;width:100%}
.tile:hover{transform:translateY(-3px);border-color:var(--primary)}
.tile .ic{font-size:26px}
.tile .tt{font-weight:700;font-size:14px}
.tile .ts{font-size:11.5px;color:var(--muted)}
.tile.flat{box-shadow:none;background:var(--bg)}
.btn{background:var(--primary);color:#fff;border-radius:14px;padding:11px 17px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s;border:1px solid transparent}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--bg);color:var(--text);border-color:var(--border)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.inp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:11px 13px;outline:none;transition:.2s;font-size:14.5px}
.inp:focus{border-color:var(--primary);background:var(--card)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.7}
select.inp{cursor:pointer}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(150deg,var(--primary),var(--primary2))}
.auth-box{width:100%;max-width:410px;background:var(--card);border-radius:26px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.auth-logo{width:74px;height:74px;margin:0 auto 12px;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:36px}
.auth-box h1{text-align:center;font-size:21px;margin-bottom:5px}
.auth-box .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.tabs{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button.active{background:var(--card);color:var(--primary);box-shadow:var(--sh)}
.q-text{font-size:17.5px;font-weight:800;line-height:1.85;margin-bottom:15px}
.opt{width:100%;text-align:right;background:var(--bg);border:2px solid var(--border);border-radius:15px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:600;transition:.18s}
.opt:hover{border-color:var(--primary)}
.opt .k{width:29px;height:29px;min-width:29px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px;border:1px solid var(--border)}
.opt.correct{background:rgba(34,197,94,.14);border-color:var(--ok)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:rgba(239,68,68,.13);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.explain{background:rgba(108,92,231,.09);border:1px dashed var(--primary);border-radius:15px;padding:13px;font-size:13.5px;line-height:1.9;margin-top:11px}
.explain b{color:var(--primary)}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:9px;transition:width .4s}
.row{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;background:var(--bg);margin-bottom:8px;border:1px solid var(--border)}
.row .av{width:40px;height:40px;min-width:40px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:17px;color:#fff;font-weight:800}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:11.5px;color:var(--muted);display:block}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:5px 10px;font-size:12px;font-weight:700;margin:0 0 6px 6px}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.rank{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg);margin-bottom:9px;border:1px solid var(--border)}
.rank .pos{width:36px;height:36px;min-width:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:15px;background:var(--card);border:1px solid var(--border)}
.rank.p1 .pos{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border:0}
.rank.p2 .pos{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff;border:0}
.rank.p3 .pos{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border:0}
.rank.me{outline:2px solid var(--primary)}
.empty{text-align:center;padding:38px 14px;color:var(--muted);font-size:14px}
.empty .e{font-size:44px;display:block;margin-bottom:11px}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:11px;font-weight:700;color:var(--muted)}
.badge{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:16px;background:var(--bg);border:1px solid var(--border);text-align:center}
.badge.locked{opacity:.38;filter:grayscale(1)}
.badge .bi{font-size:26px}
.badge .bn{font-size:10.5px;font-weight:700;line-height:1.4}
.timer{font-weight:900;font-size:17px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px 13px}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.45}}
.toast{position:fixed;bottom:105px;right:50%;transform:translate(50%,26px);background:#151a2d;color:#fff;padding:12px 20px;border-radius:15px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:999;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(50%,0)}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(8,10,22,.62);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(4px)}
.modal.open{display:flex}
.modal-box{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.modal-box h3{font-size:17px;margin-bottom:14px}
.flex{display:flex;align-items:center;gap:9px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:9px}
.mt{margin-top:12px}.mb{margin-bottom:12px}.center{text-align:center}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.sec-title{font-size:15px;font-weight:800;margin:16px 0 10px;display:flex;align-items:center;gap:7px}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:15px;padding:12px;text-align:center}
.stat-box b{display:block;font-size:20px}
.stat-box span{font-size:11px;color:var(--muted)}
.vid{width:100%;border-radius:14px;background:#000}
img.resp{width:100%;border-radius:14px;border:1px solid var(--border)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ==========================================================================
   قاعدة البيانات المشتركة مع admin.html
   ========================================================================== */
const DB_KEY = 'zezoLearnDB_v2';
const SESSION_KEY = 'zezoLearnSession_v2';

const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const todayKey = () => new Date().toISOString().slice(0,10);
const fmt = t => new Date(t).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});

function makeDefaultDB(){
  const Q = (id,subjectId,unitId,lessonId,text,options,correct,explanation,difficulty,points,tags)=>
    ({id,subjectId,unitId,lessonId,text,image:'',options,correct,explanation,difficulty,points,tags:tags||[]});
  return {
    settings:{
      platformName:'Zezo Learn', logo:'🚀',
      description:'منصة تعليمية تفاعلية للمذاكرة والمسابقات',
      welcome:'جاهز للمذاكرة اليوم؟ 🔥',
      primaryColor:'#6C5CE7', accentColor:'#a29bfe',
      adminUser:'admin', adminPassword:'admin123',
      footer:'صُنع بحب 💜', maintenance:false,
      showVideo:true, showPdf:true, showImages:true, allowRegister:true
    },
    users:[], subjects:[
      {id:'sub_math',name:'الرياضيات',icon:'🧮',color:'#6C5CE7',order:1,visible:true},
      {id:'sub_sci', name:'العلوم',   icon:'🔬',color:'#22c55e',order:2,visible:true},
      {id:'sub_ar',  name:'اللغة العربية',icon:'📖',color:'#f59e0b',order:3,visible:true},
      {id:'sub_soc', name:'الدراسات', icon:'🌍',color:'#0ea5e9',order:4,visible:true},
      {id:'sub_en',  name:'اللغة الإنجليزية',icon:'🇬🇧',color:'#ef4444',order:5,visible:true}
    ],
    units:[
      {id:'u1',subjectId:'sub_math',name:'الوحدة الأولى: العمليات الأساسية',order:1},
      {id:'u2',subjectId:'sub_math',name:'الوحدة الثانية: الكسور',order:2},
      {id:'u3',subjectId:'sub_sci', name:'الوحدة الأولى: الكائنات الحية',order:1}
    ],
    lessons:[
      {id:'l1',unitId:'u1',subjectId:'sub_math',title:'الدرس الأول: الجمع والطرح',order:1,locked:false,
       content:'الجمع هو ضم مجموعتين للحصول على المجموع، والطرح هو إزالة كمية من كمية أخرى.',video:'',pdf:'',images:[]},
      {id:'l2',unitId:'u1',subjectId:'sub_math',title:'الدرس الثاني: الضرب والقسمة',order:2,locked:false,
       content:'الضرب هو جمع متكرر، والقسمة هي توزيع بالتساوي.',video:'',pdf:'',images:[]},
      {id:'l3',unitId:'u3',subjectId:'sub_sci',title:'الدرس الأول: الخلية',order:1,locked:false,
       content:'الخلية هي وحدة البناء الأساسية في الكائنات الحية.',video:'',pdf:'',images:[]}
    ],
    questions:[
      Q('q1','sub_math','u1','l1','ما ناتج 5 × 4 ؟',['10','15','20','25'],2,'لأن 5 × 4 = 20 (الضرب جمع متكرر).','easy',10,['ضرب']),
      Q('q2','sub_math','u1','l1','ما ناتج 12 + 8 ؟',['18','20','22','24'],1,'لأن 12 + 8 = 20.','easy',10,['جمع']),
      Q('q3','sub_math','u1','l1','ما ناتج 30 - 17 ؟',['12','13','14','15'],1,'لأن 30 - 17 = 13.','easy',10,['طرح']),
      Q('q4','sub_math','u1','l2','ما ناتج 36 ÷ 6 ؟',['5','6','7','8'],1,'لأن 6 × 6 = 36.','medium',15,['قسمة']),
      Q('q5','sub_math','u1','l2','ما ناتج 7 × 8 ؟',['54','56','58','64'],1,'لأن 7 × 8 = 56.','medium',15,['ضرب']),
      Q('q6','sub_math','u2','','ما هو 1/2 في صورة نسبة مئوية؟',['25%','40%','50%','75%'],2,'لأن 1/2 = 0.5 = 50%.','medium',15,['كسور']),
      Q('q7','sub_math','u2','','ما هو 3/4 + 1/4 ؟',['1/2','3/4','1','4/8'],2,'لأن 3+1 = 4، و 4/4 = 1.','medium',15,['كسور']),
      Q('q8','sub_math','','','ما هو العدد الأولي بين الأعداد التالية؟',['9','15','17','21'],2,'17 لا يقبل القسمة إلا على نفسه وعلى 1.','hard',20,['أعداد']),
      Q('q9','sub_math','','','إذا كان س + 5 = 12، فما قيمة س؟',['5','6','7','8'],2,'س = 12 - 5 = 7.','easy',10,['جبر']),
      Q('q10','sub_sci','u3','l3','ما هي وحدة البناء الأساسية في الكائنات الحية؟',['النسيج','الخلية','العضو','الجهاز'],1,'الخلية هي أصغر وحدة قادرة على الحياة.','easy',10,['أحياء']),
      Q('q11','sub_sci','u3','l3','ما الغاز الذي تحتاجه النباتات في عملية البناء الضوئي؟',['الأكسجين','النيتروجين','ثاني أكسيد الكربون','الهيدروجين'],2,'النبات يستهلك ثاني أكسيد الكربون وينتج الأكسجين.','easy',10,['نبات']),
      Q('q12','sub_sci','','','ما الكوكب الأقرب إلى الشمس؟',['الزهرة','عطارد','الأرض','المريخ'],1,'عطارد هو أقرب كوكب إلى الشمس.','easy',10,['فضاء']),
      Q('q13','sub_ar','','','ما نوع كلمة «كتاب» من حيث النوع؟',['مذكر','مؤنث','جمع','مثنى'],0,'«كتاب» مذكر.','easy',10,['لغة']),
      Q('q14','sub_ar','','','جمع كلمة «قلم» هو:',['أقلام','قلمون','قلمات','قلماء'],0,'جمع تكسير: أقلام.','easy',10,['لغة']),
      Q('q15','sub_soc','','','ما هي عاصمة مصر؟',['الإسكندرية','القاهرة','أسوان','المنصورة'],1,'القاهرة هي العاصمة.','easy',10,['جغرافيا']),
      Q('q16','sub_en','','','Choose: I ___ a student.',['am','is','are','be'],0,'مع I نستخدم am.','easy',10,['grammar'])
    ],
    quizzes:[
      {id:'qz1',name:'الجولة السهلة',subjectId:'sub_math',unitId:'',lessonId:'',desc:'5 أسئلة سريعة',
       questionIds:['q1','q2','q3','q9','q4'],random:false,count:5,time:0,points:10,locked:false},
      {id:'qz2',name:'تحدي الأبطال 💀',subjectId:'sub_math',unitId:'',lessonId:'',desc:'أسئلة قوية',
       questionIds:['q5','q6','q7','q8','q9'],random:false,count:5,time:120,points:20,locked:false},
      {id:'qz3',name:'جولة العلوم',subjectId:'sub_sci',unitId:'',lessonId:'',desc:'كل ما يخص العلوم',
       questionIds:['q10','q11','q12'],random:false,count:3,time:0,points:10,locked:false}
    ],
    notifications:[], activities:[], answerLog:[], suggestions:[], reports:[], polls:[], announcements:[],
    achievements:[
      {id:'a1',name:'أول 10 أسئلة',icon:'🥉',cond:'answered10',reward:20},
      {id:'a2',name:'أول 100 سؤال',icon:'🥈',cond:'answered100',reward:100},
      {id:'a3',name:'100 إجابة صحيحة',icon:'🧠',cond:'correct100',reward:150},
      {id:'a4',name:'7 أيام متتالية',icon:'🔥',cond:'streak7',reward:200},
      {id:'a5',name:'10 إجابات متتالية',icon:'⚡',cond:'combo10',reward:120},
      {id:'a6',name:'المركز الأول',icon:'👑',cond:'rank1',reward:300},
      {id:'a7',name:'أنهيت أول جولة',icon:'🎯',cond:'quiz1',reward:30},
      {id:'a8',name:'أسطورة المنصة',icon:'🏆',cond:'points5000',reward:500}
    ]
  };
}

let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){ DB = makeDefaultDB(); saveDB(); return DB; }
    DB = JSON.parse(raw);
    const d = makeDefaultDB();
    DB.settings = Object.assign(d.settings, DB.settings||{});
    ['users','subjects','units','lessons','questions','quizzes','notifications','activities','answerLog','suggestions','reports','achievements','polls','announcements']
      .forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=d[k]; });
    return DB;
  }catch(e){ DB = makeDefaultDB(); return DB; }
}
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ console.warn('Storage full', e); } }

let ME = null;
function restoreSession(){
  const id = localStorage.getItem(SESSION_KEY);
  if(id){ const u = DB.users.find(x=>x.id===id); if(u && u.status!=='banned') ME=u; }
}
function startSession(u){
  ME = u;
  localStorage.setItem(SESSION_KEY, u.id);
  u.lastLogin = now();
  const t = todayKey();
  if(u.lastStreakDate !== t){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yk = y.toISOString().slice(0,10);
    u.streak = (u.lastStreakDate === yk) ? (u.streak||0)+1 : 1;
    u.lastStreakDate = t;
  }
  logAct('login','تسجيل دخول');
  saveDB();
}
function endSession(){
  if(ME) logAct('logout','تسجيل خروج');
  ME = null;
  localStorage.removeItem(SESSION_KEY);
  state.view='home';
  render();
}

function logAct(type, detail){
  DB.activities.unshift({
    id: uid('act'), userId: ME?ME.id:'', userName: ME?ME.name:'زائر',
    type, detail: detail||'', time: now()
  });
  if(DB.activities.length > 3000) DB.activities.length = 3000;
  saveDB();
}
function pushAnswer(q, correct, chosen){
  DB.answerLog.unshift({id:uid('ans'),qid:q.id,userId:ME?ME.id:'',userName:ME?ME.name:'',correct,chosen,time:now(),points:q.points});
  if(DB.answerLog.length > 8000) DB.answerLog.length = 8000;
  saveDB();
}
function levelOf(p){
  if(p>=6000) return {k:'أسطورة',i:'👑'};
  if(p>=3000) return {k:'محترف',i:'🟠'};
  if(p>=1500) return {k:'متقدم',i:'🟣'};
  if(p>=500)  return {k:'متعلم',i:'🔵'};
  return {k:'مبتدئ',i:'🟢'};
}
function myRank(){
  const sorted = [...DB.users].filter(u=>u.status!=='banned').sort((a,b)=>b.points-a.points);
  const i = sorted.findIndex(u=>u.id===ME.id);
  return i<0 ? sorted.length+1 : i+1;
}
function periodStart(p){
  const d = new Date(); d.setHours(0,0,0,0);
  if(p==='day') return d.getTime();
  if(p==='week'){ const x = new Date(d); x.setDate(x.getDate()-((x.getDay()+1)%7)); return x.getTime(); }
  if(p==='month') return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  return 0;
}
function pointsIn(p){
  const from = periodStart(p);
  const map = {};
  DB.answerLog.forEach(a=>{ if(a.time>=from && a.correct){ map[a.userId]=(map[a.userId]||0)+(a.points||10); }});
  DB.users.forEach(u=>{ if(u.points && p==='all') map[u.id]=u.points; });
  return map;
}
function unreadCount(){
  if(!ME) return 0;
  const seen = ME.seenNotifs||[];
  return DB.notifications.filter(n=>!seen.includes(n.id)).length;
}
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show '+(type||'');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.className='toast '+(type||''), 2300);
}
function openModal(h){ document.getElementById('modalBox').innerHTML = h; document.getElementById('modal').classList.add('open'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

function applySettings(){
  const s = DB.settings;
  document.documentElement.style.setProperty('--primary', s.primaryColor||'#6C5CE7');
  document.documentElement.style.setProperty('--primary2', s.accentColor||'#a29bfe');
  document.title = s.platformName || 'منصة تعليمية';
}

function checkAchievements(){
  if(!ME) return;
  const st = ME.stats||{answered:0,correct:0};
  const granted = [];
  const has = id => (ME.badges||[]).includes(id);
  const give = id => {
    const a = DB.achievements.find(x=>x.id===id);
    if(a && !has(id)){
      ME.badges = ME.badges||[]; ME.badges.push(id);
      ME.points += a.reward||0; granted.push(a);
    }
  };
  if(st.answered>=10) give('a1');
  if(st.answered>=100) give('a2');
  if(st.correct>=100) give('a3');
  if((ME.streak||0)>=7) give('a4');
  if((ME.bestCombo||0)>=10) give('a5');
  if((ME.quizzesDone||[]).length>=1) give('a7');
  if(ME.points>=5000) give('a8');
  if(DB.users.length>1 && myRank()===1) give('a6');
  if(granted.length){ saveDB(); granted.forEach(a=>toast(`${a.icon} إنجاز: ${a.name} (+${a.reward})`,'ok')); }
}

/* ===================== Quiz Engine ===================== */
function startQuizById(qzId){
  const qz = DB.quizzes.find(q=>q.id===qzId);
  if(!qz || qz.locked) return toast('غير متاحة','bad');
  let qs = (qz.questionIds||[]).map(id=>DB.questions.find(q=>q.id===id)).filter(Boolean);
  if(qz.random) qs = shuffle(qs).slice(0, qz.count||qs.length);
  if(!qs.length) return toast('لا توجد أسئلة','bad');
  beginQuiz({title:qz.name, questions:qs, time:qz.time||0, points:qz.points||10, exam:!!qz.exam});
}
function startFreeQuiz(subId, n){
  const all = DB.questions.filter(q=>q.subjectId===subId);
  if(!all.length) return toast('لا توجد أسئلة','bad');
  beginQuiz({title:'تدريب عشوائي', questions:shuffle(all).slice(0,Math.min(n,all.length)), time:0, points:10});
}
function startSpeedGame(){
  if(!DB.questions.length) return toast('لا توجد أسئلة','bad');
  beginQuiz({title:'⚡ سرعة البرق', questions:shuffle(DB.questions).slice(0,40), time:60, points:5, speed:true});
}
function startDailyChallenge(){
  if(!DB.questions.length) return toast('لا توجد أسئلة','bad');
  const seed = todayKey().split('-').join('');
  const idx = parseInt(seed,10)%DB.questions.length;
  beginQuiz({title:'🎯 سؤال اليوم', questions:[DB.questions[idx]], time:0, points:30});
}
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }

function beginQuiz(cfg){
  state.quiz = {
    title:cfg.title, questions:cfg.questions, idx:0, answers:[],
    correct:0, wrong:0, combo:0, bestCombo:0, earned:0,
    points:cfg.points||10, exam:!!cfg.exam, speed:!!cfg.speed,
    startTime:now(), limit:cfg.time||0, left:cfg.time||0,
    timerId:null, answered:false, chosen:-1
  };
  if(cfg.time>0){
    state.quiz.timerId = setInterval(()=>{
      if(!state.quiz) return;
      state.quiz.left--;
      const el = document.getElementById('qTimer');
      if(el){ el.textContent='⏱️ '+fmtTime(state.quiz.left); if(state.quiz.left<=10) el.classList.add('low'); }
      if(state.quiz.left<=0){ clearInterval(state.quiz.timerId); state.quiz.timerId=null; finishQuiz(true); }
    },1000);
  }
  go('quiz');
}
function fmtTime(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function quizView(){
  const q = state.quiz;
  if(!q) return '<div class="empty">لا توجد جولة</div>';
  const cur = q.questions[q.idx];
  if(!cur) return '<div class="empty">انتهت الأسئلة</div>';
  const pct = (q.idx/q.questions.length)*100;
  const answered = q.answered, chosen = q.chosen;
  return `
  <div class="flex-between mb">
    <button class="btn ghost sm" data-act="quitQuiz">✕ خروج</button>
    <div class="flex">
      <span class="pill">${q.idx+1} / ${q.questions.length}</span>
      ${q.limit?`<span class="timer" id="qTimer">⏱️ ${fmtTime(q.left)}</span>`:''}
    </div>
  </div>
  <div class="bar mb"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div class="flex-between mb">
      <span class="pill">${esc(q.title)}</span>
      <span class="pill">⭐ ${q.points}</span>
    </div>
    <div class="q-text">${esc(cur.text)}</div>
    ${cur.image?`<img class="resp mb" src="${esc(cur.image)}" alt="">`:''}
    ${cur.options.map((op,i)=>{
      let cls='opt';
      if(answered && !q.exam){
        if(i===cur.correct) cls+=' correct';
        else if(i===chosen) cls+=' wrong';
        else cls+=' dim';
      }
      return `<button class="${cls}" ${answered&&!q.exam?'disabled':''} data-act="answer" data-i="${i}">
        <span class="k">${['A','B','C','D'][i]}</span><span>${esc(op)}</span></button>`;
    }).join('')}
    ${answered && !q.exam?`
      <div class="explain">
        ${chosen===cur.correct
          ? `<b>✅ إجابة صحيحة! 🎉 +${q.points+(q.combo>=2?5:0)} نقطة</b>`
          : `<b style="color:var(--bad)">❌ إجابتك خاطئة</b><br>✅ الإجابة الصحيحة: <b>${esc(cur.options[cur.correct])}</b>`}
        <br><br>🧠 <b>لماذا؟</b><br>${esc(cur.explanation||'لا يوجد تفسير.')}
        ${q.combo>=2?`<br><br>🔥 سلسلة: ${q.combo}`:''}
      </div>
      <button class="btn block mt" data-act="nextQ">${q.idx+1>=q.questions.length?'🏁 عرض النتيجة':'السؤال التالي →'}</button>
    `:''}
    ${answered && q.exam?`<button class="btn block mt" data-act="nextQ">${q.idx+1>=q.questions.length?'🏁 إنهاء':'التالي →'}</button>`:''}
  </div>
  ${q.exam?'<p class="muted center">🎓 وضع الامتحان: لن تظهر الإجابات حتى النهاية</p>':''}`;
}
function answerQuestion(i){
  const q = state.quiz;
  if(!q || q.answered) return;
  const cur = q.questions[q.idx];
  q.chosen = i; q.answered = true;
  const isCorrect = i === cur.correct;
  q.answers.push({qid:cur.id, chosen:i, correct:isCorrect, text:cur.text});
  if(isCorrect){
    q.correct++; q.combo++;
    q.bestCombo = Math.max(q.bestCombo, q.combo);
    let pts = q.points;
    if(q.combo>=2) pts += 5;
    q.earned += pts;
    ME.points += pts;
  } else {
    q.wrong++; q.combo = 0;
    ME.wrong = ME.wrong||[];
    if(!ME.wrong.some(w=>w.qid===cur.id)){
      ME.wrong.unshift({qid:cur.id, chosen:i, time:now()});
      if(ME.wrong.length>300) ME.wrong.length=300;
    }
  }
  ME.stats = ME.stats||{answered:0,correct:0};
  ME.stats.answered++;
  if(isCorrect) ME.stats.correct++;
  ME.bestCombo = Math.max(ME.bestCombo||0, q.bestCombo);
  const t = todayKey();
  ME.dailyTasks = (ME.dailyTasks && ME.dailyTasks.date===t) ? ME.dailyTasks : {date:t,answered:0,quiz:0,review:0};
  ME.dailyTasks.answered++;
  pushAnswer(cur, isCorrect, i);
  logAct(isCorrect?'correct':'wrong', (isCorrect?'صحيحة: ':'خاطئة: ')+cur.text.slice(0,50));
  saveDB();
  checkAchievements();
  render();
}
function nextQuestion(){
  const q = state.quiz;
  if(!q) return;
  q.idx++; q.answered=false; q.chosen=-1;
  if(q.idx>=q.questions.length) return finishQuiz(false);
  render();
}
function finishQuiz(timeUp){
  const q = state.quiz;
  if(!q) return;
  if(q.timerId){ clearInterval(q.timerId); q.timerId=null; }
  const total = q.questions.length;
  const answeredCount = q.correct+q.wrong;
  const acc = answeredCount ? Math.round(q.correct/answeredCount*100) : 0;
  if(!q.exam && total>=3){ ME.points += 30; q.earned += 30; }
  const t = todayKey();
  ME.dailyTasks = (ME.dailyTasks && ME.dailyTasks.date===t) ? ME.dailyTasks : {date:t,answered:0,quiz:0,review:0};
  ME.dailyTasks.quiz++;
  ME.quizzesDone = ME.quizzesDone||[];
  ME.quizzesDone.push({title:q.title, score:acc, time:now(), total:q.correct});
  ME.progress = ME.progress||{lessonsDone:[],quizzesDone:[]};
  ME.progress.quizzesDone = ME.progress.quizzesDone||[];
  ME.progress.quizzesDone.push({title:q.title, score:acc, time:now()});
  logAct('quiz',`إنهاء "${q.title}" — ${q.correct}/${total} (${acc}%)`);
  saveDB();
  checkAchievements();
  state.quizResult = {
    title:q.title, total, correct:q.correct, wrong:q.wrong,
    acc, earned:q.earned, timeUp:!!timeUp, details:q.answers
  };
  state.quiz = null;
  go('result');
}

/* ===================== Render ===================== */
function render(){
  applySettings();

  if(!ME){ app.innerHTML = authView(); return; }
  if(DB.settings.maintenance){
    app.innerHTML = `<div class="empty" style="padding-top:100px"><span class="e">🛠️</span>
      <b>المنصة تحت الصيانة</b><p class="muted mt">سنعود قريبًا</p></div>`;
    return;
  }
  let content = '';
  switch(state.view){
    case 'home': content = homeView(); break;
    case 'subjects': content = subjectsView(); break;
    case 'subject': content = subjectView(state.params.id); break;
    case 'lesson': content = lessonView(state.params.id); break;
    case 'quiz': app.innerHTML = shell(quizView()); bindDynamic(); return;
    case 'result': content = resultView(); break;
    case 'games': content = gamesView(); break;
    case 'leaderboard': content = leaderboardView(); break;
    case 'library': content = libraryView(); break;
    case 'profile': content = profileView(); break;
    case 'notifications': content = notificationsView(); break;
    default: content = homeView();
  }
  app.innerHTML = shell(content);
  bindDynamic();
}
function bindDynamic(){
  const si = document.getElementById('searchInput');
  if(si){
    si.addEventListener('input', e=>{
      state.searchQ = e.target.value;
      clearTimeout(si._t);
      si._t = setTimeout(()=>showSearchResults(state.searchQ), 250);
    });
  }
}
function showSearchResults(q){
  q = (q||'').trim();
  if(q.length < 2) return;
  const subs = DB.subjects.filter(s=>s.name.includes(q));
  const lessons = DB.lessons.filter(l=>l.title.includes(q)||(l.content||'').includes(q));
  const questions = DB.questions.filter(x=>x.text.includes(q)).slice(0,10);
  openModal(`
    <h3>🔍 نتائج البحث: ${esc(q)}</h3>
    ${subs.length?`<div class="sec-title">📚 المواد</div>${subs.map(s=>`<button class="row" style="width:100%;text-align:right" data-act="openSubject" data-id="${s.id}"><span class="av">${s.icon}</span><div class="m"><b>${esc(s.name)}</b></div></button>`).join('')}`:''}
    ${lessons.length?`<div class="sec-title">📕 الدروس</div>${lessons.map(l=>`<button class="row" style="width:100%;text-align:right" data-act="openLesson" data-id="${l.id}"><span class="av">📕</span><div class="m"><b>${esc(l.title)}</b></div></button>`).join('')}`:''}
    ${questions.length?`<div class="sec-title">❓ الأسئلة</div>${questions.map(x=>`<div class="row"><span class="av">❓</span><div class="m"><b>${esc(x.text)}</b><span>${esc(x.options[x.correct])}</span></div></div>`).join('')}`:''}

}

/* ===================== Events ===================== */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  switch(act){
    case 'toggleTheme':
      document.body.classList.toggle('dark');
      localStorage.setItem('zezo_theme', document.body.classList.contains('dark')?'dark':'light');
      render(); break;
    case 'go': go(t.dataset.view); break;
    case 'authTab': state.authTab = t.dataset.tab; render(); break;
    case 'openSubject': go('subject', {id:t.dataset.id}); break;
    case 'openLesson': go('lesson', {id:t.dataset.id}); break;
    case 'startQuiz': startQuizById(t.dataset.id); break;
    case 'freeQuiz': startFreeQuiz(t.dataset.id, parseInt(t.dataset.n,10)); break;
    case 'lessonQuiz': {
      const qs = DB.questions.filter(x=>x.lessonId===t.dataset.id);
      if(!qs.length) return toast('لا توجد أسئلة','bad');
      beginQuiz({title:'أسئلة الدرس', questions:qs, time:0, points:10});
      break;
    }
    case 'answer': answerQuestion(parseInt(t.dataset.i,10)); break;
    case 'nextQ': nextQuestion(); break;
    case 'quitQuiz':
      if(state.quiz && state.quiz.timerId) clearInterval(state.quiz.timerId);
      state.quiz = null; go('home'); break;
    case 'speedGame': startSpeedGame(); break;
    case 'dailyChallenge': startDailyChallenge(); break;
    case 'randomGame': {
      if(!DB.questions.length) return toast('لا توجد أسئلة','bad');
      beginQuiz({title:'🎲 عشوائي', questions:shuffle(DB.questions).slice(0,20), time:0, points:10});
      break;
    }
    case 'hardGame': {
      const qs = shuffle(DB.questions.filter(x=>x.difficulty==='hard'));
      if(!qs.length) return toast('لا توجد أسئلة صعبة','bad');
      beginQuiz({title:'💀 تحدي الصعب', questions:qs.slice(0,15), time:0, points:25});
      break;
    }
    case 'friendGame': {
      const qs = shuffle(DB.questions).slice(0,5);
      if(!qs.length) return toast('لا توجد أسئلة','bad');
      const code = Math.random().toString(36).slice(2,7).toUpperCase();
      openModal(`<h3>⚔️ تحدي صديق</h3>
        <p class="muted mb">كود التحدي:</p>
        <div class="center" style="font-size:30px;font-weight:900;letter-spacing:5px;color:var(--primary)">${code}</div>
        <p class="muted center mt">شاركه مع صديقك</p>
        <button class="btn block mt" onclick="closeModal();window._friendQuiz()">▶️ ابدأ</button>`);
      window._friendQuiz = ()=> beginQuiz({title:'⚔️ تحدي صديق', questions:qs, time:0, points:15});
      break;
    }
    case 'lbPeriod': state.lbPeriod = t.dataset.p; render(); break;
    case 'fav': {
      ME.favorites = ME.favorites||[];
      const type = t.dataset.type, id = t.dataset.id;
      const i = ME.favorites.findIndex(f=>f.type===type && f.id===id);
      if(i>=0){ ME.favorites.splice(i,1); toast('تم الإزالة'); }
      else { ME.favorites.push({type,id,time:now()}); toast('⭐ أُضيف','ok'); }
      saveDB(); render(); break;
    }
    case 'unfav':
      ME.favorites = (ME.favorites||[]).filter(f=>!(f.type===t.dataset.type && f.id===t.dataset.id));
      saveDB(); render(); break;
    case 'noteLesson': {
      openModal(`<h3>✍️ ملاحظة جديدة</h3>
        <div class="field"><label>العنوان</label><input class="inp" id="noteTitle"></div>
        <div class="field"><label>الملاحظة</label><textarea class="inp" id="noteBody"></textarea></div>
        <button class="btn block" id="saveNote">💾 حفظ</button>`);
      document.getElementById('saveNote').onclick = ()=>{
        const title = document.getElementById('noteTitle').value.trim()||'ملاحظة';
        const body = document.getElementById('noteBody').value.trim();
        if(!body) return toast('اكتب الملاحظة','bad');
        ME.notes = ME.notes||[];
        ME.notes.unshift({id:uid('n'), title, body, time:now()});
        saveDB(); closeModal(); toast('✅ تم الحفظ','ok'); render();
      };
      break;
    }
    case 'delNote':
      ME.notes = (ME.notes||[]).filter(n=>n.id!==t.dataset.id);
      saveDB(); render(); break;
    case 'reviewWrong': {
      const qs = ME.wrong.slice(0,10).map(w=>DB.questions.find(x=>x.id===w.qid)).filter(Boolean);
      if(!qs.length) return toast('لا توجد أخطاء','bad');
      const tt = todayKey();
      ME.dailyTasks = (ME.dailyTasks && ME.dailyTasks.date===tt) ? ME.dailyTasks : {date:tt,answered:0,quiz:0,review:0};
      ME.dailyTasks.review += qs.length;
      saveDB();
      beginQuiz({title:'❌ مراجعة الأخطاء', questions:qs, time:0, points:15});
      break;
    }
    case 'changeAvatar': {
      const list = ['👤','👦','👧','🧑‍🎓','👨‍🎓','👩‍🎓','🦸','🐯','🦊','🐼','🚀','⭐','🔥','🧠'];
      openModal(`<h3>🖼️ اختر صورتك</h3>
        <div class="grid g4">${list.map(a=>`<button class="tile flat" data-act="setAvatar" data-a="${a}" style="align-items:center;font-size:29px">${a}</button>`).join('')}</div>`);
      break;
    }
    case 'setAvatar':
      ME.avatar = t.dataset.a; saveDB(); closeModal(); render(); break;
    case 'suggest': {
      openModal(`<h3>💡 اقتراح / مشكلة</h3>
        <div class="field"><label>النوع</label>
          <select class="inp" id="sgType">
            <option value="idea">💡 فكرة</option>
            <option value="request">📚 طلب</option>
            <option value="problem">⚠️ مشكلة</option>
          </select></div>
        <div class="field"><label>الرسالة</label><textarea class="inp" id="sgText"></textarea></div>
        <button class="btn block" id="sgSend">📩 إرسال</button>`);
      document.getElementById('sgSend').onclick = ()=>{
        const type = document.getElementById('sgType').value;
        const text = document.getElementById('sgText').value.trim();
        if(!text) return toast('اكتب رسالتك','bad');
        DB.suggestions.unshift({id:uid('sg'), userId:ME.id, userName:ME.name, type, text, time:now(), status:'new'});
        saveDB(); closeModal(); toast('✅ تم الإرسال','ok');
      };
      break;
    }
    case 'report': {
      const qs = DB.questions;
      if(!qs.length) return toast('لا توجد أسئلة','bad');
      openModal(`<h3>🚩 إبلاغ عن سؤال</h3>
        <div class="field"><label>اختر السؤال</label>
          <select class="inp" id="rpQ">${qs.map(q=>`<option value="${q.id}">${esc(q.text.slice(0,60))}</option>`).join('')}</select></div>
        <div class="field"><label>سبب الإبلاغ</label><textarea class="inp" id="rpText" placeholder="اشرح المشكلة..."></textarea></div>
        <button class="btn bad block" id="rpSend">🚩 إرسال الإبلاغ</button>`);
      document.getElementById('rpSend').onclick = ()=>{
        const qid = document.getElementById('rpQ').value;
        const text = document.getElementById('rpText').value.trim();
        if(!text) return toast('اكتب السبب','bad');
        DB.reports.unshift({id:uid('rp'), qid, userId:ME.id, userName:ME.name, text, time:now(), status:'new'});
        saveDB(); closeModal(); toast('✅ تم الإبلاغ','ok');
      };
      break;
    }
    case 'logout':
      openModal(`<h3>🚪 تسجيل الخروج</h3><p class="muted mb">هل أنت متأكد؟</p>
        <div class="flex"><button class="btn bad" style="flex:1" id="okLogout">نعم</button>
        <button class="btn ghost" style="flex:1" onclick="closeModal()">إلغاء</button></div>`);
      document.getElementById('okLogout').onclick = ()=>{ closeModal(); endSession(); };
      break;
    case 'resume': {
      const l = ME.lastItem;
      if(l && l.type==='lesson') go('lesson', {id:l.id});
      else go('subjects');
      break;
    }
  }
});

document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form]');
  if(!f) return;
  e.preventDefault();
  const type = f.dataset.form;
  const fd = new FormData(f);
  if(type === 'register'){
    const name = (fd.get('name')||'').trim();
    const username = (fd.get('username')||'').trim().toLowerCase();
    const password = fd.get('password')||'';
    if(!DB.settings.allowRegister) return toast('التسجيل مغلق','bad');
    if(name.length<2) return toast('اكتب اسمك','bad');
    if(username.length<3) return toast('اسم المستخدم قصير','bad');
    if(password.length<4) return toast('كلمة المرور قصيرة','bad');
    if(DB.users.some(u=>u.username===username)) return toast('اسم المستخدم مستخدم','bad');
    const u = {
      id:uid('u'), name, username, password, email:'', avatar:'👤',
      points:0, createdAt:now(), lastLogin:now(), status:'active',
      streak:0, lastStreakDate:'', seenNotifs:[],
      stats:{answered:0,correct:0}, wrong:[], favorites:[], notes:[], badges:[],
      progress:{lessonsDone:[],quizzesDone:[]}, quizzesDone:[],
      lastItem:null, bestCombo:0,
      dailyTasks:{date:todayKey(), answered:0, quiz:0, review:0}
    };
    DB.users.push(u);
    saveDB();
    startSession(u);
    logAct('register','تسجيل حساب جديد');
    toast('🎉 أهلاً '+name,'ok');
    go('home');
    return;
  }
  if(type === 'login'){
    const username = (fd.get('username')||'').trim().toLowerCase();
    const password = fd.get('password')||'';
    const u = DB.users.find(x=>x.username===username);
    if(!u || u.password !== password) return toast('بيانات غير صحيحة','bad');
    if(u.status === 'banned') return toast('الحساب موقوف','bad');
    startSession(u);
    toast('👋 أهلاً '+u.name,'ok');
    go('home');
  }
});

(function init(){
  if(localStorage.getItem('zezo_theme')==='dark') document.body.classList.add('dark');
  loadDB();
  restoreSession();
  render();
  window.addEventListener('storage', e=>{
    if(e.key === DB_KEY){
      loadDB();
      if(ME) ME = DB.users.find(u=>u.id===ME.id) || ME;
      render();
    }
  });
})();
</script>
</body>
