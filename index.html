
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEZO ROBOT 🤖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">🤖 ZEZO ROBOT</div>
    <div class="status" id="status">جاهز أكلمك ❤️</div>
  </header>

  <main>
    <section class="robot">
      <div class="antenna"></div>
      <div class="robot-head" id="robotHead">
        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth" id="mouth"></div>
      </div>
      <div class="robot-body">
        <div class="heart">💙</div>
      </div>
    </section>

    <h1>أنا زيزو! 😎</h1>
    <p class="subtitle">روبوتك الذكي وصاحبك الجديد</p>

    <section class="chat-box" id="chatBox">
      <div class="message bot">
        أهلاً يا صاحبي! 😂❤️ أنا زيزو، يلا نتكلم!
      </div>
    </section>

    <div class="typing" id="typing"></div>

    <div class="controls">
      <input
        type="text"
        id="messageInput"
        placeholder="اكتب لزيزو هنا..."
        autocomplete="off"
      >
      <button id="sendBtn">إرسال 🚀</button>
    </div>

    <div class="buttons">
      <button id="micBtn">🎤 اتكلم</button>
      <button id="stopBtn">🔇 إيقاف الصوت</button>
      <button id="clearBtn">🗑️ مسح المحادثة</button>
    </div>
  </main>

  <footer>ZEZO ROBOT © 2026</footer>

  <script src="script.js"></script>
</body>
</html>
